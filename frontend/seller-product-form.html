<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body data-requires-login="true">
  <header id="site-header"></header>

  <main class="container">
    <h1 id="form-heading">Add product</h1>

    <!-- Loading and error messages (filled by seller-product-form.js) -->
    <div id="form-status"><p class="state-loading">Loading...</p></div>

    <form id="product-form" class="product-form" hidden novalidate>
      <label for="product-name">Name</label>
      <input type="text" id="product-name" maxlength="200">

      <label for="product-description">Description</label>
      <textarea id="product-description" rows="6" maxlength="5000"></textarea>

      <label for="product-price">Price (in rupees)</label>
      <input type="text" id="product-price" inputmode="decimal">

      <label for="product-stock">Stock</label>
      <input type="text" id="product-stock" inputmode="numeric">

      <label for="product-category">Category</label>
      <select id="product-category"></select>

      <label for="product-image-url">Image URL (optional)</label>
      <input type="text" id="product-image-url" maxlength="500" placeholder="https://...">

      <label class="checkbox-label">
        <input type="checkbox" id="product-is-active" checked>
        <span>Active (shown in the store)</span>
      </label>

      <p id="form-error" class="error-message" hidden></p>

      <div class="form-buttons">
        <button type="submit" id="product-submit-button">Save product</button>
        <a class="button button-secondary" href="/seller-products.html">Cancel</a>
      </div>
    </form>
  </main>

  <footer id="site-footer"></footer>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/layout.js"></script>
  <script src="/static/js/seller-product-form.js"></script>
</body>
</html>
